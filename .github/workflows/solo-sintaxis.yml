name: Solo sintaxis (sin ejecutar)

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Ruta del script a validar (NO se ejecuta el flujo destructivo)'
        required: true
        default: '06-SafeMode-RunExe-Test.ps1'

permissions:
  contents: write

jobs:
  sintaxis:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: 1) Sintaxis (parser PS 5.1) - principal + here-strings embebidos
        shell: powershell
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          $fallo = $false
          $ruta = (Resolve-Path $env:SCRIPT).Path
          Write-Output "===== Validando: $env:SCRIPT ====="

          $tokens = $null; $errores = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($ruta, [ref]$tokens, [ref]$errores)
          if ($errores.Count -gt 0) {
            $fallo = $true
            Write-Output "::error::SCRIPT PRINCIPAL: $($errores.Count) error(es)"
            foreach ($e in $errores) { Write-Output ("  linea {0}, col {1}: {2}" -f $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message) }
          } else { Write-Output "OK: sintaxis del script principal" }

          $raw = Get-Content -LiteralPath $ruta -Raw
          $rx = [regex]"(?s)@'\r?\n(.*?)\r?\n'@"
          $m = $rx.Matches($raw)
          Write-Output ("Here-strings embebidos encontrados: " + $m.Count)
          $i = 0
          foreach ($match in $m) {
            $i++; $contenido = $match.Groups[1].Value
            $tk = $null; $er = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($contenido, [ref]$tk, [ref]$er)
            if ($er.Count -gt 0) {
              $fallo = $true
              Write-Output "::error::HERE-STRING #$i : $($er.Count) error(es)"
              foreach ($e in $er) { Write-Output ("  (bloque) linea {0}, col {1}: {2}" -f $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message) }
            } else { Write-Output "OK: here-string embebido #$i" }
          }

          $bytes = [IO.File]::ReadAllBytes($ruta)
          $bom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
          $noAscii = [bool]($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1)
          if ($noAscii -and -not $bom) { Write-Output "::warning::Caracteres no ASCII sin BOM UTF-8 (PS 5.1 los lee mal)" } else { Write-Output "OK: codificacion (BOM=$bom noASCII=$noAscii)" }
          if ($fallo) { Write-Output "RESULTADO SINTAXIS: ERRORES"; exit 1 }
          Write-Output "RESULTADO SINTAXIS: OK"

      - name: 2) Analisis estatico (PSScriptAnalyzer) - principal + worker embebido
        shell: powershell
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          $rep = Join-Path $env:RUNNER_TEMP "hallazgos.txt"
          "=== PSScriptAnalyzer ===" | Set-Content $rep -Encoding UTF8
          Set-PSRepository PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          }
          Import-Module PSScriptAnalyzer
          $ruta = (Resolve-Path $env:SCRIPT).Path
          $huboError = $false

          function Mostrar($res, $titulo) {
            Write-Output "----- $titulo -----"
            if (-not $res) { Write-Output "  (sin observaciones)"; return $false }
            $hayError = $false
            foreach ($r in $res) {
              $sev = $r.Severity
              $linea = ("  [{0}] {1} linea {2}: {3} ({4})" -f $sev, $titulo, $r.Line, $r.Message, $r.RuleName)
              if ($sev -eq 'Error') { Write-Output "::error::$linea"; $hayError = $true }
              elseif ($sev -eq 'Warning') { Write-Output "::warning::$linea" }
              else { Write-Output $linea }
              ("[{0}] {1} L{2}: {3} ({4})" -f $sev, $titulo, $r.Line, $r.Message, $r.RuleName) | Out-File -Append -FilePath (Join-Path $env:RUNNER_TEMP "hallazgos.txt") -Encoding utf8
            }
            return $hayError
          }

          # a) sobre el script principal
          $res1 = Invoke-ScriptAnalyzer -Path $ruta -Severity Error,Warning -ErrorAction SilentlyContinue
          if (Mostrar $res1 "SCRIPT PRINCIPAL") { $huboError = $true }

          # b) sobre cada worker embebido (lo extraigo a archivo temporal y lo analizo)
          $raw = Get-Content -LiteralPath $ruta -Raw
          $rx = [regex]"(?s)@'\r?\n(.*?)\r?\n'@"
          $i = 0
          foreach ($match in $rx.Matches($raw)) {
            $i++
            $tmp = Join-Path $env:RUNNER_TEMP ("embebido_$i.ps1")
            Set-Content -LiteralPath $tmp -Value $match.Groups[1].Value -Encoding UTF8
            $resN = Invoke-ScriptAnalyzer -Path $tmp -Severity Error,Warning -ErrorAction SilentlyContinue
            if (Mostrar $resN "HERE-STRING EMBEBIDO #$i") { $huboError = $true }
          }

          if ($huboError) { "RESULTADO: HAY ERRORES" | Out-File -Append (Join-Path $env:RUNNER_TEMP "hallazgos.txt"); "HAYERROR=1" >> $env:GITHUB_ENV }
          else { "RESULTADO: sin errores" | Out-File -Append (Join-Path $env:RUNNER_TEMP "hallazgos.txt"); "HAYERROR=0" >> $env:GITHUB_ENV }
          Write-Output "PSScriptAnalyzer termino (ver artifact hallazgos)"

      - name: 2b) Commitear hallazgos al repo (_resultados/hallazgos.txt)
        if: always()
        shell: pwsh
        run: |
          $dest = Join-Path (Get-Location) "_resultados"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $f = Join-Path $env:RUNNER_TEMP "hallazgos.txt"
          if (-not (Test-Path $f)) { "sin archivo de hallazgos" | Set-Content $f }
          Copy-Item $f (Join-Path $dest "hallazgos.txt") -Force
          git config user.name "gh-actions"
          git config user.email "actions@github.com"
          git add _resultados/hallazgos.txt
          git commit -m "resultados: hallazgos PSScriptAnalyzer [skip ci]" 2>&1 | Out-Host
          git push origin HEAD:main 2>&1 | Out-Host
          Write-Output "hallazgos commiteados en _resultados/"

      - name: 3) Ejecutar SOLO el payload aislado (corre el exe + captura, NO toca bcdedit)
        shell: powershell
        run: |
          # Replica exacta de la logica PAYLOAD del worker, sobre un exe inofensivo,
          # para probar ProcessStartInfo + timeout + captura + exit code en Windows real.
          $PayloadExe  = "C:\Windows\System32\ipconfig.exe"
          $PayloadArgs = "/all"
          $PayloadLog  = Join-Path $env:RUNNER_TEMP "payload.txt"

          "==== PAYLOAD $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') :: $PayloadExe $PayloadArgs ====" | Set-Content $PayloadLog -Encoding UTF8
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName  = $PayloadExe
          $psi.Arguments = $PayloadArgs
          $psi.WorkingDirectory = (Split-Path -Parent $PayloadExe)
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError  = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow  = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(120000)) { try { $p.Kill() } catch {}; Add-Content $PayloadLog "[TIMEOUT]" }
          $out = $p.StandardOutput.ReadToEnd()
          $err = $p.StandardError.ReadToEnd()
          Add-Content $PayloadLog $out
          if ($err) { Add-Content $PayloadLog ("[STDERR]`r`n" + $err) }
          Add-Content $PayloadLog ("[EXIT CODE] " + $p.ExitCode)

          Write-Output "ExitCode del payload: $($p.ExitCode)"
          Write-Output "Tamano de la salida capturada: $((Get-Item $PayloadLog).Length) bytes"
          Write-Output "----- primeras lineas capturadas -----"
          Get-Content $PayloadLog -TotalCount 12
          if ($p.ExitCode -ne 0) { Write-Output "::error::El payload devolvio exit code distinto de 0"; exit 1 }
          if ((Get-Item $PayloadLog).Length -lt 50) { Write-Output "::error::No se capturo salida (log casi vacio)"; exit 1 }
          Write-Output "RESULTADO PAYLOAD: OK (corrio, capturo salida y exit 0)"

name: Probar WireGuard v05 (exito y error)

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Ruta del script'
        required: true
        default: '05-AgregarPermisosWireGuard.ps1'

permissions:
  contents: write

jobs:
  probar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Crear 2 usuarios locales limitados
        shell: powershell
        run: |
          $sig = '[DllImport("userenv.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern int CreateProfile([MarshalAs(UnmanagedType.LPWStr)] string pszUserSid, [MarshalAs(UnmanagedType.LPWStr)] string pszUserName, [Out][MarshalAs(UnmanagedType.LPWStr)] System.Text.StringBuilder pszProfilePath, uint cchProfilePath);'
          $api = Add-Type -MemberDefinition $sig -Namespace WG -Name Prof -PassThru
          foreach ($u in @(@{N="jperez";P="Prueba#2026aA!"}, @{N="mlopez";P="Prueba#2026bB!"})) {
            cmd /c "net user `"$($u.N)`" `"$($u.P)`" /add" | Out-Null
            $sid = (New-Object System.Security.Principal.NTAccount($env:COMPUTERNAME, $u.N)).Translate([System.Security.Principal.SecurityIdentifier]).Value
            $sb = New-Object System.Text.StringBuilder(260)
            [void]$api::CreateProfile($sid, $u.N, $sb, 260)
            Write-Output "Creado $($u.N)  $sid"
          }

      - name: CASO 1 - EXITO (correr 05 como SYSTEM)
        shell: pwsh
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'PSTools.zip'; $dir = Join-Path $env:RUNNER_TEMP 'PSTools'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/PSTools.zip' -OutFile $zip -TimeoutSec 120
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $psexec = Join-Path $dir 'PsExec64.exe'
          $ps51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $ruta = (Resolve-Path $env:SCRIPT).Path
          $log = Join-Path $env:RUNNER_TEMP "r1.txt"; $cmd = Join-Path $env:RUNNER_TEMP "l1.cmd"
          @('@echo off', "`"$ps51`" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$ruta`" > `"$log`" 2>&1", 'exit /b %ERRORLEVEL%') | Set-Content -LiteralPath $cmd -Encoding ascii
          $p = Start-Process -FilePath $psexec -ArgumentList @('-accepteula','-nobanner','-s','cmd.exe','/c',"`"$cmd`"") -NoNewWindow -PassThru
          $null = $p.Handle; $p.WaitForExit(120000) | Out-Null
          $out = Join-Path (Get-Location) "_resultados\wg-v05.txt"
          New-Item -ItemType Directory -Path (Split-Path $out) -Force | Out-Null
          "################  CASO 1: EXITO  ################" | Set-Content $out -Encoding utf8
          "(2 usuarios limitados nuevos, nada roto)" | Add-Content $out -Encoding utf8
          "Exit code: $($p.ExitCode)" | Add-Content $out -Encoding utf8
          "----- LO QUE VE EN PANTALLA -----" | Add-Content $out -Encoding utf8
          if (Test-Path $log) { Get-Content -LiteralPath $log -Encoding Oem | Add-Content $out -Encoding utf8 }

      - name: Inyectar un perfil con SID inexistente (para forzar el error parcial)
        shell: powershell
        run: |
          $bogus = "S-1-5-21-9999999999-8888888888-7777777777-2001"
          $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$bogus"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name ProfileImagePath -Value "C:\Users\fantasma" -PropertyType ExpandString -Force | Out-Null
          Write-Output "Inyectado perfil fantasma $bogus"

      - name: CASO 2 - OBSERVACIONES (correr 05 de nuevo)
        shell: pwsh
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          $psexec = Join-Path (Join-Path $env:RUNNER_TEMP 'PSTools') 'PsExec64.exe'
          $ps51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $ruta = (Resolve-Path $env:SCRIPT).Path
          $log = Join-Path $env:RUNNER_TEMP "r2.txt"; $cmd = Join-Path $env:RUNNER_TEMP "l2.cmd"
          @('@echo off', "`"$ps51`" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$ruta`" > `"$log`" 2>&1", 'exit /b %ERRORLEVEL%') | Set-Content -LiteralPath $cmd -Encoding ascii
          $p = Start-Process -FilePath $psexec -ArgumentList @('-accepteula','-nobanner','-s','cmd.exe','/c',"`"$cmd`"") -NoNewWindow -PassThru
          $null = $p.Handle; $p.WaitForExit(120000) | Out-Null
          $out = Join-Path (Get-Location) "_resultados\wg-v05.txt"
          "" | Add-Content $out -Encoding utf8
          "################  CASO 2: OBSERVACIONES  ################" | Add-Content $out -Encoding utf8
          "(los 2 ya estan + 1 perfil con SID que no resuelve)" | Add-Content $out -Encoding utf8
          "Exit code: $($p.ExitCode)" | Add-Content $out -Encoding utf8
          "----- LO QUE VE EN PANTALLA -----" | Add-Content $out -Encoding utf8
          if (Test-Path $log) { Get-Content -LiteralPath $log -Encoding Oem | Add-Content $out -Encoding utf8 }
          "" | Add-Content $out -Encoding utf8
          "----- CONTENIDO DEL LOG INTERNO (C:\ProgramData\IT\Wireguard\log.txt) -----" | Add-Content $out -Encoding utf8
          if (Test-Path "C:\ProgramData\IT\Wireguard\log.txt") { Get-Content "C:\ProgramData\IT\Wireguard\log.txt" | Add-Content $out -Encoding utf8 }

      - name: Commit salida
        if: always()
        shell: pwsh
        run: |
          git config user.name "gh-actions"; git config user.email "actions@github.com"
          git add _resultados/wg-v05.txt
          git commit -m "resultados: WireGuard v05 exito y observaciones [skip ci]" 2>&1 | Out-Host
          git push origin HEAD:main 2>&1 | Out-Host
